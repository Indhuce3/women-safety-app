<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>Women Safety Route Estimator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .box { max-width: 480px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; margin-top: 12px; display: block; font-size: 14px; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 20px; width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .result { margin-top: 20px; padding: 12px; background: #e9ecef; font-weight: bold; text-align: center; border-radius: 5px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Women Safety Route Predictor</h2>
        <form method="POST">
            <label>Area Name:</label>
            <select name="area">
                {% for loc in locations %}
                <option value="{{ loc }}">{{ loc }}</option>
                {% endfor %}
            </select>

            <label>Time of Night (20.0 to 28.0):</label>
            <input type="number" step="0.5" name="time" value="22.0" required>

            <label>Streetlight Density Score (1-10):</label>
            <input type="number" name="lights" min="1" max="10" value="5" required>

            <label>Police Patrol Frequency:</label>
            <input type="number" name="patrol" min="0" max="10" value="2" required>

            <label>Distance to Public Hotspot (meters):</label>
            <input type="number" name="distance" value="500" required>

            <label>Historical Crime Rate:</label>
            <input type="number" name="crime" value="3" required>

            <label>Weather:</label>
            <select name="weather">
                {% for w in weathers %}
                <option value="{{ w }}">{{ w }}</option>
                {% endfor %}
            </select>

            <button type="submit">Predict Safety Score</button>
        </form>

        {% if prediction %}
        <div class="result">{{ prediction }}</div>
        {% endif %}
    </div>
</body>
</html>
